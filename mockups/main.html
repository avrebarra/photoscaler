<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photoscaler — RHZ6PJF Redesign (Presentation)</title>
  <script src="https://unpkg.com/preact@10/dist/preact.umd.js"></script>
  <script src="https://unpkg.com/preact@10/hooks/dist/hooks.umd.js"></script>
  <script src="https://unpkg.com/htm@3/dist/htm.umd.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", ui-sans-system, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    .hairline { border-color: rgba(255,255,255,.08); }
    .dock { background: rgba(9,9,11,.86); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); }
    .bezel { background: linear-gradient(145deg,#3a3a3c,#1c1c1e 40%,#48484a); box-shadow: 0 30px 60px rgba(0,0,0,.35), inset 0 0 0 2px rgba(255,255,255,.08); }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { width: 44px; height: 44px; border-radius: 9999px; border: 3px solid rgba(255,255,255,.18); border-top-color: #fff; animation: spin .9s linear infinite; }
    @keyframes pulse-soft { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
    .pulse { animation: pulse-soft 2.2s ease-in-out infinite; }
    @keyframes shimmer { 0% { background-position: -200px 0 } 100% { background-position: 200px 0 } }
    .skeleton { background: linear-gradient(90deg, rgba(255,255,255,.04) 25%, rgba(255,255,255,.10) 37%, rgba(255,255,255,.04) 63%); background-size: 400px 100%; animation: shimmer 1.4s linear infinite; }
  </style>
</head>
<body class="min-h-screen" style="background:#9aa88b">
  <!-- presentation mockup: RHZ6PJF v8 — app-store-worthy pass: 16px gutters, 56px headers, Finish pill, big wordmark everywhere -->
  <div id="root"></div>
  <script>
    const html = htm.bind(preact.h);
    const { useState } = preactHooks;
    const IMG = "https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=700&q=80&auto=format&fit=crop";
    const IMGW = "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=900&q=80&auto=format&fit=crop"; // landscape sample

    // icons
    function mk(d, s=18) { return html`<svg width=${s} height=${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d=${d}/></svg>`; }
    const IconCheck = () => mk("M20 6 9 17l-5-5");
    const IconBack  = () => mk("M15 18l-6-6 6-6", 17);
    const IconUndo  = () => mk("M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3");
    const IconDownload = () => mk("M12 3v12M7 10l5 5 5-5M4 21h16", 17);
    const IconCrop  = () => mk("M6 2v14a2 2 0 0 0 2 2h14|M18 22V8a2 2 0 0 0-2-2H2", 19);
    const IconResize = () => mk("M3 3h18v18H3z|M9 3v18M12 3v18", 19);
    const IconWifi = () => mk("M5 12a11 11 0 0 1 14 0M8 15a7 7 0 0 1 8 0M11.5 18h1", 12);

    // status bar
    function StatusBar() {
      return html`
        <div class="flex items-center justify-between px-7 pt-3.5 pb-0.5 text-[13px] font-semibold text-white select-none">
          <span>9:41</span>
          <div class="flex items-center gap-1.5">
            <svg width="17" height="11" viewBox="0 0 17 11"><rect x="0" y="6" width="3" height="5" rx="1" fill="white"/><rect x="4.5" y="4" width="3" height="7" rx="1" fill="white"/><rect x="9" y="2" width="3" height="9" rx="1" fill="white"/><rect x="13.5" y="0" width="3" height="11" rx="1" fill="white"/></svg>
            <${IconWifi} />
            <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0" y="0" width="21" height="12" rx="3.5" stroke="white" stroke-opacity=".4" fill="none"/><rect x="2" y="2" width="15" height="8" rx="2" fill="white"/><path d="M23 4v4a2 2 0 0 0 0-8z" fill="white" fill-opacity=".4"/></svg>
          </div>
        </div>
      `;
    }

    // wordmark — app text logo
    function Wordmark({ big }) {
      return html`<h1 class="font-bold tracking-[-.02em] text-white leading-none ${big ? 'text-[26px]' : 'text-[19px]'}">Photoscaler</h1>`;
    }

    // header — 72px, roomy; home = centered wordmark; others = wordmark/back+title left, actions right
    function Header({ wordmark, title, onBack, center, children }) {
      if (center) {
        return html`
          <div class="dock border-b hairline h-[72px] px-6 flex items-center shrink-0">
            <span class="w-10"></span>
            <div class="flex-1 flex justify-center"><${Wordmark} big=${wordmark} /></div>
            <span class="w-10"></span>
          </div>
        `;
      }
      return html`
        <div class="dock border-b hairline h-[72px] px-6 flex items-center justify-between shrink-0">
          ${onBack
            ? html`<div class="flex items-center gap-1.5 -ml-1.5">
                <button class="h-10 w-10 rounded-full grid place-items-center text-white active:bg-white/10 transition"><${IconBack} /></button>
                <h1 class="text-[19px] font-bold tracking-[-.02em] leading-none">${title}</h1>
              </div>`
            : html`<${Wordmark} big=${wordmark} />`}
          <div class="flex items-center gap-1">${children || null}</div>
        </div>
      `;
    }

    // ghost icon bar button (undo/reset)
    function BarBtn({ label, dim, children }) {
      return html`<button aria-label="${label}" class="h-10 w-10 rounded-full grid place-items-center text-zinc-300 active:bg-white/10 transition ${dim ? 'opacity-30' : ''}">${children}</button>`;
    }
    // primary pill — icon + text (Finish / Apply); compact so the big wordmark fits beside it
    function PillBtn({ label, onClick, children }) {
      return html`<button aria-label="${label}" onClick=${onClick} class="h-10 pl-2.5 pr-3.5 rounded-full bg-white text-black font-semibold text-[14px] flex items-center gap-1.5 active:scale-95 transition shadow-[0_2px_10px_rgba(0,0,0,.35)]">${children}</button>`;
    }

    // hero — letterboxed: pure black, object-contain only, with dimension badge overlay
    function Hero({ crop, img, badgeText }) {
      const src = img || IMG;
      return html`
        <div class="flex-1 min-h-0 px-3 pt-4 flex flex-col">
          <div class="relative flex-1 rounded-[18px] overflow-hidden bg-black min-h-[320px]">
            <img src=${src} alt="preview" class="absolute inset-0 h-full w-full object-contain" />
            ${crop && html`
              <div class="absolute inset-[9%] border-[1.5px] border-white/95" style="box-shadow: 0 0 0 9999px rgba(0,0,0,.45)">
                ${["-top-1.5 -left-1.5","-top-1.5 -right-1.5","-bottom-1.5 -left-1.5","-bottom-1.5 -right-1.5"].map(pos => html`
                  <span class="absolute ${pos} h-3.5 w-3.5 rounded-[4px] bg-white ring-1 ring-black/40"></span>`)}
              </div>
            `}
            ${badgeText ? html`<span aria-label="dimensions" class="absolute bottom-2 left-2 rounded-full bg-black/60 backdrop-blur px-2.5 py-1 text-[11px] font-medium text-white tabular-nums pointer-events-none">${badgeText}</span>` : null}
          </div>
        </div>
      `;
    }

    // dock — 16px gutters, generous rhythm, home indicator
    function Dock({ children }) {
      return html`
        <div class="dock border-t hairline px-6 pt-4 pb-7 flex flex-col gap-3.5 shrink-0">
          ${children}
        </div>
      `;
    }

    // tool segmented control
    function ToolSeg({ onPick }) {
      return html`
        <div class="mx-auto flex items-center gap-1 rounded-full bg-white/10 p-1">
          <button aria-label="Crop" onClick=${() => onPick("crop")} class="h-11 px-8 rounded-full grid place-items-center bg-white text-black transition"><${IconCrop} /></button>
          <button aria-label="Resize" onClick=${() => onPick("resize")} class="h-11 px-8 rounded-full grid place-items-center text-zinc-300 transition"><${IconResize} /></button>
        </div>
      `;
    }

    // home — no header bar: wordmark as hero top-center, drop box fills the bottom
    function HomeScreen() {
      return html`
        <div class="flex flex-col h-full">
          <div class="flex-1 flex flex-col items-center pt-[270px] min-h-0">
            <div class="text-center">
              <h1 class="text-[40px] font-bold tracking-[-.02em] leading-none text-white">Photoscaler</h1>
              <p class="text-[14px] text-zinc-400 mt-3">Simple image upscaler</p>
            </div>
          </div>
          <div class="h-[300px] shrink-0 px-6 mb-[110px] flex flex-col">
            <div class="flex-1 rounded-[18px] bg-zinc-900 border hairline flex flex-col overflow-hidden">
              <div class="flex-1 flex flex-col items-center justify-center gap-4 px-7 m-2 rounded-[14px] border border-dashed border-white/10 bg-black/40 text-center">
                <button class="h-12 px-9 rounded-full bg-white text-[16px] font-semibold text-black active:scale-95 transition shadow-[0_2px_10px_rgba(0,0,0,.35)]">Choose image</button>
                <p class="text-[13px] text-zinc-500">or drop it here</p>
              </div>
            </div>
          </div>

        </div>
      `;
    }

    // editor — wordmark header + undo/reset icons + Finish pill; tools in dock, badge inside hero
    function EditorScreen({ onPick }) {
      return html`
        <div class="flex flex-col h-full">
          <${Header} wordmark=${true} children=${html`<div class="flex items-center gap-1">
              <${BarBtn} label="Undo" dim><${IconUndo} /></${BarBtn}>
              <${PillBtn} label="Finish — download PNG"><${IconDownload} />Finish</${PillBtn}>
            </div>`} />
          <div class="flex-1 min-h-0 flex flex-col">
            <${Hero} img=${IMGW} badgeText="4032 × 3024 px" />
          </div>
          <${Dock}><${ToolSeg} onPick=${onPick} /></${Dock}>
        </div>
      `;
    }

    // crop — own page, badge inside hero
    function CropScreen({ goBack }) {
      return html`
        <div class="flex flex-col h-full">
          <${Header} title="Crop" onBack=${goBack} children=${html`<${PillBtn} label="Apply crop" onClick=${goBack}><${IconCheck} />Apply</${PillBtn}>`} />
          <div class="flex-1 min-h-0 flex flex-col"><${Hero} crop=${true} badgeText="4032 × 3024 px" /></div>
          <${Dock}>
            <div class="flex gap-2 justify-between">
              ${["Free","1:1","4:3","16:9","Original"].map((l,i) => html`
                <button class="flex-1 h-11 rounded-full text-[13px] font-medium transition active:scale-95 ${i===0 ? 'bg-white text-black' : 'bg-white/10 text-zinc-300'}">${l}</button>
              `)}
            </div>
          </${Dock}>
        </div>
      `;
    }

    // resize — own page; tick dial scrub + Snapseed-style settings overlay (QN5Z74X):
    // dial replaces slider; presets removed; dimension badge left of % readout; gear opens
    // overlay with mode chips + grain toggle/strength
    const MODE_META = {
      smooth:   { chip: "Blur" },
      lanczos:  { chip: "Lanczos" },
      pixelate: { chip: "Pixelate" },
    };
    function ResizeScreen({ goBack }) {
      const [pct, setPct] = useState(150);
      const [settingsOpen, setSettingsOpen] = useState(false);
      const [mode, setMode] = useState("smooth");
      const [grainEnabled, setGrainEnabled] = useState(false);
      const [strength, setStrength] = useState(35);
      const ORIG = { w: 900, h: 700 };
      const MINP = 2, MAXP = 400; // demo: ceil(10/700*100)=2 … long side cap
      const clampInt = (v) => Math.round(Math.max(MINP, Math.min(MAXP, v)));
      const clampFloat = (v) => Math.max(MINP, Math.min(MAXP, v));
      const [dragging, setDragging] = useState(false);
      const [atBound, setAtBound] = useState(null);
      const fracRef = preactHooks.useRef(pct);
      const stripRef = preactHooks.useRef(null);
      preactHooks.useEffect(() => { fracRef.current = pct; if (stripRef.current) stripRef.current.style.transform = `translate3d(${-pct*10}px,0,0)`; }, [pct]);
      const updateStrip = (frac, animate) => {
        const el = stripRef.current; if (!el) return;
        el.style.transition = animate ? "transform 180ms cubic-bezier(0.2,0.8,0.2,1)" : "none";
        el.style.transform = `translate3d(${-frac*10}px,0,0)`;
      };
      const drag = (e) => {
        const el = e.currentTarget; const startX = e.clientX; const startFrac = fracRef.current; let curFrac = startFrac; let vel = 0; let lastX = startX; let lastT = performance.now();
        setDragging(true); el.setPointerCapture(e.pointerId);
        const move = (ev) => {
          const now = performance.now(); const dx = ev.clientX - startX; let next = startFrac - dx/3;
          if (next < MINP) { const over = MINP - next; next = MINP - Math.pow(over,0.72)*0.5; }
          else if (next > MAXP) { const over = next - MAXP; next = MAXP + Math.pow(over,0.72)*0.5; }
          curFrac = next; fracRef.current = next; const dt = Math.max(1, now-lastT); vel = (ev.clientX - lastX)/dt * -0.33; lastX = ev.clientX; lastT = now;
          updateStrip(next,false); const intNext = clampInt(next); setAtBound(intNext<=MINP?"min":intNext>=MAXP?"max":null); if (intNext!==pct) setPct(intNext);
        };
        const up = (ev) => {
          try{ el.releasePointerCapture(ev.pointerId);}catch{}
          el.removeEventListener("pointermove", move); el.removeEventListener("pointerup", up); el.removeEventListener("pointercancel", up);
          setDragging(false);
          let target = clampFloat(curFrac + vel*90); target = clampFloat(target); const snapped = clampInt(target);
          fracRef.current = snapped; updateStrip(snapped,true); setAtBound(snapped<=MINP?"min":snapped>=MAXP?"max":null); if(snapped!==pct) setPct(snapped);
          setTimeout(()=>setAtBound(null),260);
        };
        el.addEventListener("pointermove", move); el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
      };
      const handleWheel = (e) => { e.preventDefault(); const dir=Math.sign(e.deltaY); const step=dir>0?-1:dir<0?1:0; if(!step) return; const next=clampInt(fracRef.current+step); fracRef.current=next; updateStrip(next,true); setAtBound(next<=MINP?"min":next>=MAXP?"max":null); setPct(next); setTimeout(()=>setAtBound(null),220); };
      const handleKey = (e) => { let next=null; if(e.key==="ArrowRight"||e.key==="ArrowUp") next=clampInt(pct+1); else if(e.key==="ArrowLeft"||e.key==="ArrowDown") next=clampInt(pct-1); else if(e.key==="Home") next=MINP; else if(e.key==="End") next=MAXP; if(next==null) return; e.preventDefault(); fracRef.current=next; updateStrip(next,true); setAtBound(next<=MINP?"min":next>=MAXP?"max":null); setPct(next); setTimeout(()=>setAtBound(null),220); };
      const out = { w: Math.round(ORIG.w * pct / 100), h: Math.round(ORIG.h * pct / 100) };
      const IconGear = () => mk("M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z|M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z", 16);
      return html`
        <div class="relative flex flex-col h-full">
          <${Header} title="Resize" onBack=${goBack} children=${html`<${PillBtn} label="Apply resize" onClick=${goBack}><${IconCheck} />Apply</${PillBtn}>`} />
          <div class="flex-1 min-h-0 flex flex-col"><${Hero} badgeText="${out.w} × ${out.h} px" /></div>
          <${Dock}>
            <div class="flex items-center gap-2">
              <span class="flex-1 text-center text-[24px] font-bold tracking-[-.01em] text-white tabular-nums leading-none">${pct}%</span>
              <button aria-label="Resize settings" onClick=${() => setSettingsOpen(true)} class="shrink-0 h-9 w-9 rounded-full grid place-items-center bg-white/10 text-zinc-300 active:bg-white/20 transition"><${IconGear} /></button>
            </div>
            <div
              class=${`relative h-[52px] rounded-xl bg-zinc-950 border overflow-hidden touch-none select-none focus:outline-none focus-visible:ring-2 focus-visible:ring-white/40 ${dragging ? 'border-zinc-700 cursor-grabbing' : 'border-zinc-800 cursor-ew-resize'} ${atBound ? 'brightness-110' : ''}`}
              onPointerDown=${drag}
              onWheel=${handleWheel}
              onKeyDown=${handleKey}
              tabIndex="0"
              role="slider" aria-label="Scale dial" aria-valuenow=${pct} aria-valuemin=${MINP} aria-valuemax=${MAXP}
            >
              <div class="pointer-events-none absolute inset-0" style="background: linear-gradient(to right, transparent, black 12%, black 88%, transparent); opacity:0.6; -webkit-mask-image: linear-gradient(to right, transparent, black 12%, black 88%, transparent)"></div>
              <div ref=${stripRef} class="absolute inset-y-0 left-1/2 will-change-transform" style=${`transform: translate3d(${-pct*10}px,0,0); width: 10000px; margin-left: 0px`}>
                ${Array.from({length: 501}, (_,k) => k).map(i => {
                  const isMajor = i%10===0; const isMid=i%5===0; const h=isMajor?18:isMid?12:7; const op=isMajor?0.9:isMid?0.45:0.22; const showLabel=isMajor && i%25===0;
                  return html`<span key=${i} style=${`position:absolute;left:${i*10}px;bottom:14px;width:1px;height:${h}px;opacity:${op};background:white;transform:translateX(-0.5px)`}>${showLabel ? html`<em style="position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:9px;font-style:normal;color:rgba(255,255,255,0.55);font-weight:500;letter-spacing:0.02em">${i}</em>` : null}</span>`;
                })}
              </div>
              <div class=${`absolute left-1/2 top-0 h-full w-0 -translate-x-1/2 pointer-events-none transition-transform duration-200 ${dragging ? 'scale-y-[1.04]' : ''}`}>
                <div class=${`h-full w-px mx-auto transition-colors duration-200 ${atBound ? 'bg-white shadow-[0_0_10px_rgba(255,255,255,0.6)]' : dragging ? 'bg-white/95' : 'bg-white/90'}`}></div>
                <div class=${`absolute top-0 left-1/2 -translate-x-1/2 h-2 w-2 rounded-full bg-white -mt-[1px] transition-all duration-200 ${dragging ? 'scale-125 shadow-[0_2px_10px_rgba(255,255,255,0.5)]' : ''} ${atBound ? 'scale-150 shadow-[0_0_12px_rgba(255,255,255,0.7)]' : ''}`}></div>
                <div class="absolute bottom-[10px] left-1/2 -translate-x-1/2 h-2 w-2 rounded-full bg-white/90" style="box-shadow:0 1px 6px rgba(0,0,0,0.6)"></div>
              </div>
              <span class=${`pointer-events-none absolute right-2 top-1.5 text-[9px] font-medium tracking-widest text-white/25 transition-opacity duration-300 ${dragging ? 'opacity-0' : 'opacity-100'}`}>DRAG</span>
            </div>
          </${Dock}>
          <!-- Snapseed-style settings overlay: scrim over everything, bottom sheet with mode chips + per-mode param -->
          ${settingsOpen && html`
            <div class="absolute inset-0 z-30 flex flex-col">
              <div class="absolute inset-0 bg-zinc-950/80 backdrop-blur-sm" onClick=${() => setSettingsOpen(false)}></div>
              <div class="dock relative mt-auto mx-3 mb-10 rounded-[24px] border hairline px-5 pt-4 pb-6 flex flex-col gap-4 shadow-[0_20px_50px_rgba(0,0,0,.5)]">
                <div class="flex items-center justify-between">
                  <span class="text-[14.5px] font-semibold text-white">Resize settings</span>
                  <button aria-label="Close settings" onClick=${() => setSettingsOpen(false)} class="h-9 w-9 rounded-full grid place-items-center text-zinc-300 active:bg-white/10 transition"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
                </div>
                <div class="flex flex-col gap-2">
                  <span class="text-xs font-medium text-zinc-500">Interpolation</span>
                  <div class="flex gap-2">
                    ${["smooth","lanczos","pixelate"].map(m => html`
                      <button onClick=${() => setMode(m)} class="flex-1 h-10 rounded-full text-[12.5px] font-medium transition active:scale-95 ${m===mode ? 'bg-white text-black' : 'bg-white/10 text-zinc-300'}">${MODE_META[m].chip}</button>
                    `)}
                  </div>
                </div>
                <div class="flex flex-col gap-2 rounded-xl bg-zinc-950 border hairline px-3 py-3">
                  <label class="flex items-center justify-between cursor-pointer">
                    <span class="text-xs font-medium text-zinc-500">Grain (on top)</span>
                    <input type="checkbox" checked=${grainEnabled} onChange=${(e) => setGrainEnabled(e.target.checked)} class="accent-white" />
                  </label>
                  ${grainEnabled && html`
                    <div class="flex items-center justify-between">
                      <span class="text-xs font-medium text-zinc-500">Grain strength</span>
                      <span class="text-xs text-zinc-400 tabular-nums">${strength}</span>
                    </div>
                    <input type="range" min="0" max="100" step="1" value=${strength} onInput=${(e) => setStrength(Number(e.target.value))} class="flex-1 accent-white" />
                  `}
                </div>
                <button onClick=${() => setSettingsOpen(false)} class="h-10 rounded-full bg-white text-black text-[13.5px] font-semibold active:scale-95 transition">Done</button>
              </div>
            </div>
          `}
        </div>
      `;
    }

    // loading — picked image decoding before first render: skeleton hero + spinner, no tools yet
    function LoadingScreen() {
      return html`
        <div class="flex flex-col h-full">
          <${Header} wordmark=${true} children=${html`<div class="flex items-center gap-1 opacity-30">
              <${BarBtn} label="Undo" dim><${IconUndo} /></${BarBtn}>
            </div>`} />
          <div class="flex-1 min-h-0 flex flex-col">
            <div class="flex-1 min-h-0 px-3 pt-4">
              <div class="relative h-full rounded-[18px] overflow-hidden bg-zinc-900 border hairline flex flex-col items-center justify-center gap-5">
                <div class="skeleton absolute inset-0"></div>
                <div class="spinner relative"></div>
                <p class="text-[14px] font-medium text-white pulse relative">Loading image…</p>
              </div>
            </div>
            <p class="text-center text-[11px] text-zinc-500 pt-3.5 pb-1.5 tabular-nums tracking-wide">photo-forest.jpg</p>
          </div>
          <${Dock}>
            <div class="flex items-center justify-center gap-3 opacity-30">
              <span class="h-11 w-11 rounded-full grid place-items-center bg-white/10 text-zinc-300"><${IconCrop} /></span>
              <span class="h-11 w-11 rounded-full grid place-items-center bg-white/10 text-zinc-300"><${IconResize} /></span>
            </div>
          </${Dock}>
        </div>
      `;
    }

    // processing — applying ops: image held blurred/dim, spinner + status, no controls
    function ProcessingScreen() {
      return html`
        <div class="flex flex-col h-full">
          <${Header} wordmark=${true} children=${html`<div class="flex items-center gap-1 opacity-40">
              <${BarBtn} label="Undo"><${IconUndo} /></${BarBtn}>
            </div>`} />
          <div class="flex-1 min-h-0 flex flex-col">
            <div class="flex-1 min-h-0 px-3 pt-4 relative">
              <div class="relative h-full rounded-[18px] overflow-hidden bg-black">
                <img src=${IMGW} alt="" class="absolute inset-0 h-full w-full object-cover blur-md scale-105 opacity-50" />
                <div class="absolute inset-0 bg-black/30"></div>
                <div class="absolute inset-0 flex flex-col items-center justify-center gap-5">
                  <div class="spinner"></div>
                  <p class="text-[14px] font-medium text-white pulse">Applying changes…</p>
                </div>
              </div>
            </div>
            <p class="text-center text-[11px] text-zinc-500 pt-3.5 pb-1.5 tabular-nums tracking-wide">4032 × 3024 px</p>
          </div>
          <${Dock}>
            <div class="flex items-center justify-center gap-3 opacity-30">
              <span class="h-11 w-11 rounded-full grid place-items-center bg-white/10 text-zinc-300"><${IconCrop} /></span>
              <span class="h-11 w-11 rounded-full grid place-items-center bg-white/10 text-zinc-300"><${IconResize} /></span>
            </div>
          </${Dock}>
        </div>
      `;
    }

    // phone shell — TRUE scale: 393×852 (iPhone 15), so header/dock density matches the real device
    function Phone({ title, caption, children }) {
      return html`
        <figure class="flex flex-col items-center gap-6">
          <div class="bezel relative w-[393px] h-[852px] rounded-[56px] p-[11px]">
            <div class="relative w-full h-full rounded-[46px] overflow-hidden bg-zinc-950 flex flex-col">
              <div class="absolute top-[13px] left-1/2 -translate-x-1/2 h-[27px] w-[105px] rounded-full bg-black z-20"></div>
              <${StatusBar} />
              <div class="flex-1 min-h-0 flex flex-col">${children}</div>
            </div>
          </div>
          <figcaption class="text-center">
            <p class="text-[15px] font-semibold text-white">${title}</p>
            <p class="text-[12.5px] text-black/50 mt-1 max-w-[300px] leading-snug">${caption}</p>
          </figcaption>
        </figure>
      `;
    }

    function App() {
      return html`
        <div class="w-full min-h-screen px-6 py-14">
          <header class="text-center max-w-xl mx-auto mb-12">
            <p class="text-[11px] font-bold tracking-[.2em] uppercase text-black/40 mb-2">Photoscaler · RHZ6PJF</p>
            <h1 class="text-[32px] font-bold tracking-tight text-white">Screen composition redesign</h1>
            <p class="text-[14px] text-black/60 mt-2">Image-first editing. One primary action per header — Finish closes the loop.</p>
          </header>

          <div class="flex flex-wrap justify-center gap-x-8 gap-y-12 max-w-[1800px] mx-auto">
            <${Phone} title="Home" caption="Wordmark + pick. Nothing else.">
              <${HomeScreen} />
            </${Phone}>
            <${Phone} title="Editor" caption="Undo · Finish in header. Tools in the dock.">
              <${EditorScreen} onPick=${() => {}} />
            </${Phone}>
            <${Phone} title="Crop" caption="Own page. Apply commits, back discards.">
              <${CropScreen} goBack=${() => {}} />
            </${Phone}>
            <${Phone} title="Resize" caption="Own page. Tick dial scrub + settings overlay (Snapseed-style).">
              <${ResizeScreen} goBack=${() => {}} />
            </${Phone}>
            <${Phone} title="Processing" caption="Transient state while ops apply. Controls dim, spinner owns the moment.">
              <${ProcessingScreen} />
            </${Phone}>
            <${Phone} title="Loading" caption="Picked image decoding. Skeleton hero, controls inert until first render.">
              <${LoadingScreen} />
            </${Phone}>
          </div>

          <footer class="text-center mt-14 text-[12px] text-black/40">
            Composition — resize: tick dial scrub + Snapseed-style settings overlay (QN5Z74X) · base: RHZ6PJF
          </footer>
        </div>
      `;
    }

    preact.render(html`<${App} />`, document.getElementById("root"));
  </script>
</body>
</html>
